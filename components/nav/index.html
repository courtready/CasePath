<script>
(() => {
const navGrid = document.querySelector('.nav-grid');
const links = document.querySelectorAll('.nav-grid a');

if (navGrid && links.length) {
  const underline = document.createElement('div');
  underline.classList.add('nav-underline');
  navGrid.appendChild(underline);

  function moveUnderline(el) {
    const rect = el.getBoundingClientRect();
    const navRect = navGrid.getBoundingClientRect();
    underline.style.width = rect.width + 'px';
    underline.style.left = (rect.left - navRect.left) + 'px';
    underline.style.top = (rect.bottom - navRect.top) + 'px';
  }

  links.forEach((link) => {
    if (link.hasAttribute('href') && link.href === window.location.href) {
      link.classList.add('active');
      moveUnderline(link);
    }
    link.addEventListener('mouseenter', () => moveUnderline(link));
  });

  navGrid.addEventListener('mouseleave', () => {
    const active = document.querySelector('.nav-grid a.active');
    if (active) moveUnderline(active);
  });

  window.addEventListener('scroll', () => {
    if (window.scrollY > 10) {
      navGrid.classList.add('scrolled');
      navGrid.classList.add('shrink');
    } else {
      navGrid.classList.remove('scrolled');
      navGrid.classList.remove('shrink');
    }
  });
}
})();
</script>
