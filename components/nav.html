<script>
(() => {
const navGrid = document.querySelector('.nav-grid');
const links = document.querySelectorAll('.nav-grid a');
const authArea = document.getElementById('auth-area');
const langSwitch = document.getElementById('lang-switch');
const path = window.location.pathname.toLowerCase();
if (!window.translations) {
  window.translations = {
    en: { mission: 'Our Mission', pricing: 'Pricing' },
    ar: { mission: 'مهمتنا', pricing: 'التسعير' },
    zh: { mission: '我们的使命', pricing: '价格' }
  };
}

if (navGrid && links.length) {
  const underline = document.createElement('div');
  underline.classList.add('nav-underline');
  navGrid.appendChild(underline);

  function moveUnderline(el) {
    const rect = el.getBoundingClientRect();
    const navRect = navGrid.getBoundingClientRect();
    underline.style.width = rect.width + 'px';
    underline.style.left = (rect.left - navRect.left) + 'px';
    underline.style.top = (rect.bottom - navRect.top) + 'px';
  }

  links.forEach((link) => {
    const pageKey = (link.getAttribute('data-page') || '').toLowerCase();
    const hrefValue = (link.getAttribute('href') || '').toLowerCase();
    if (
      (hrefValue && hrefValue !== '#' && path.indexOf(hrefValue.replace(/^\.\//, '/')) !== -1) ||
      (pageKey && (path.indexOf('/' + pageKey) !== -1 || path.indexOf(pageKey + '.shtml') !== -1 || path.indexOf(pageKey + '.html') !== -1))
    ) {
      link.classList.add('active');
      moveUnderline(link);
    }
    link.addEventListener('mouseenter', () => moveUnderline(link));
  });

  navGrid.addEventListener('mouseleave', () => {
    const active = document.querySelector('.nav-grid a.active');
    if (active) moveUnderline(active);
  });

  window.addEventListener('scroll', () => {
    if (window.scrollY > 10) {
      navGrid.classList.add('scrolled');
      navGrid.classList.add('shrink');
    } else {
      navGrid.classList.remove('scrolled');
      navGrid.classList.remove('shrink');
    }
  });
}

function renderAuthArea() {
  if (!authArea) return;
  let user = null;
  try {
    user = JSON.parse(localStorage.getItem('cr_user') || localStorage.getItem('courtready_user') || 'null');
  } catch (e) {
    user = null;
  }
  if (!user || user.source !== 'supabase') {
    authArea.innerHTML = `
      <a href="/signin.shtml" onclick="if (typeof openAuth === 'function') { event.preventDefault(); openAuth('signin'); }">Sign in</a>
      <a href="/signup.shtml" class="nav-cta cta-primary" onclick="if (typeof openAuth === 'function') { event.preventDefault(); openAuth('signup'); }">Create free account</a>
    `;
    return;
  }
  const plan = user.plan || 'free';
  const credits = Number.isFinite(Number(user.docCredits)) ? Number(user.docCredits) : 0;
  authArea.innerHTML = `
    <span class="nav-plan">${plan === 'pro' ? 'Pro Plan' : `Credits: ${credits}`}</span>
    <a href="/your-case.shtml" onclick="if (typeof showPage === 'function') { event.preventDefault(); showPage('vault'); }">Your Case</a>
    <a href="#" id="navSignOutBtn">Logout</a>
  `;
  const logout = document.getElementById('navSignOutBtn');
  if (logout) {
    logout.addEventListener('click', function (event) {
      event.preventDefault();
      event.stopPropagation();
      void (async function () {
        if (typeof window.signOutFromSupabaseAndSync === 'function') {
          await window.signOutFromSupabaseAndSync();
          return;
        }
        localStorage.removeItem('cr_user');
        localStorage.removeItem('courtready_user');
        location.reload();
      })();
    });
  }
}

function applyLanguage(lang) {
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    const key = el.getAttribute('data-i18n');
    if (window.translations && window.translations[lang] && window.translations[lang][key]) {
      el.textContent = window.translations[lang][key];
    }
  });
}

if (langSwitch) {
  const savedLang = localStorage.getItem('lang') || 'en';
  langSwitch.value = savedLang;
  langSwitch.addEventListener('change', function () {
    localStorage.setItem('lang', this.value);
    applyLanguage(this.value);
  });
  applyLanguage(savedLang);
}

renderAuthArea();
})();
</script>
