deployment:
  tasks:
    - export DEPLOYPATH=/home/casepath/public_html/

    - /bin/rsync -av --delete \
      --exclude '.git' \
      --exclude '.github' \
      --exclude '.cursor' \
      --exclude '.vscode' \
      --exclude '*.zip' \
      --exclude 'New Text Document.txt' \
      --exclude 'supabase/migrations_backup' \
      ./ $DEPLOYPATH